name: Sanitizers

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  asan-ubsan:
    name: ASan + UBSan (test-native)
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: check_initialization_order=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: recursive

    # g++-14 is required for <print> — see README.md (native builds).
    - name: Install dependencies
      run: sudo apt update && sudo apt install -y g++-14

    # -D, not just the preset: sanitizers are opt-in so that the plain build-and-test jobs stay fast and the
    # coverage job does not measure an instrumented binary. Without this flag cmake/sanitizers.cmake returns
    # immediately — which is the state this job shipped in for months, exporting ASAN_OPTIONS/UBSAN_OPTIONS that
    # nothing read and reporting success with no sanitizer ever linked in.
    - name: Configure
      run: cmake --preset=test-native -DHEMERION_ENABLE_SANITIZERS=ON
      env:
        CC: gcc-14
        CXX: g++-14

    # Proof the instrumentation is present, before spending a build on it. If the flag ever stops reaching the
    # compiler, this fails here rather than the suite passing clean without a sanitizer.
    - name: Verify the sanitizer flags reached the compiler
      run: |
        grep -q -- '-fsanitize=address,undefined' build/test-native/compile_commands.json           || { echo "::error::HEMERION_ENABLE_SANITIZERS=ON but no -fsanitize in compile_commands.json"; exit 1; }

    - name: Build
      run: cmake --build --preset=test-native

    - name: Run tests
      run: ctest --preset=test-native --output-on-failure
