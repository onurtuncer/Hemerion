name: Clang-Format

on:
  push:
    branches:
      - main
  pull_request:
    # Match on the extensions .run-clang-format actually formats rather than a list of
    # top-level directories -- a directory list silently stops covering new trees (that is
    # how examples/ and cmake/ drifted out of format), and the script scans the whole repo.
    paths:
      - '**.cpp'
      - '**.hpp'
      - '**.cc'
      - '**.cxx'
      - '**.h'
      - '**.hxx'
      - '.github/workflows/clang_format.yml'
      - '**/.clang-format'
      - '.run-clang-format'
  schedule:
    - cron: '0 5 * * *' # Runs every day at 5:00 AM

jobs:
  clang_format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run clang format
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y git clang-format-18
          bash .run-clang-format
          output=$(git diff)
          if [ -n "$output" ]; then
            printf '\033[0;31mclang-format error: run the script "./.run-clang-format" and commit the result\033[0m\n'
            printf '%s\n' "$output"
            exit 1
          fi
