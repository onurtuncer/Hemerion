name: IWYU

on:
  push:
    branches:
      - main
  pull_request:
    # Everything that decides what ends up in compile_commands.json -- the Build step
    # is not continue-on-error, so a CMake or submodule change alone can fail this job
    # and must be able to trigger it. Broader than the trees iwyu_tool is pointed at
    # (modules, apps, sim): a bsp/ or tests/ change cannot alter the report today, but
    # over-triggering costs one job while under-triggering hides a regression.
    paths:
      - 'modules/**'
      - 'apps/**'
      - 'bsp/**'
      - 'sim/**'
      - 'tests/**'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - 'CMakePresets.json'
      - '.gitmodules'
      - '.github/workflows/iwyu.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iwyu:
    name: include-what-you-use (informational)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang iwyu

      # Use a direct cmake call instead of --preset=clang-debug to avoid the
      # -Rpass=.* remarks flag, which floods the build log with thousands of
      # inlining notes and makes the IWYU output unreadable.
      #
      # HEMERION_BUILD_SIM is what puts sim/ into compile_commands.json. Without
      # it the root CMakeLists never runs add_subdirectory(sim) -- SIM, FMU and
      # EXAMPLES all default OFF -- so the nineteen translation units under sim/
      # were absent from the database and naming `sim` below matched nothing at
      # all. The job reported on modules/ and one app while looking like it
      # covered five trees.
      - name: Configure
        run: |
          cmake -B build/iwyu -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DHEMERION_BUILD_TESTS=ON \
            -DHEMERION_BUILD_SIM=ON

      - name: Build
        run: cmake --build build/iwyu

      # Informational only: surfaces IWYU suggestions without failing the build.
      # The codebase is not yet IWYU-clean; this produces a diff for review.
      #
      # bsp/ and tests/ are deliberately not listed. bsp/ holds six .c files that
      # only a cross toolchain configures, and tests/ holds no C or C++ at all
      # (tests/swil is Python), so both could only ever match nothing here --
      # naming them made the argument list describe coverage the job did not
      # have. Add bsp/ back if a BSP is ever buildable natively.
      #
      # The mappings matter as much as the trees: IWYU names the header a symbol
      # is *defined* in, so without them it advises adding libstdc++ internals
      # like <bits/std_abs.h> beside the <cstdlib> already present. .iwyu.imp is
      # this repo's own list; the distribution's gcc.* files are added when the
      # iwyu package ships them, and which of those exist varies by version, so
      # each is probed rather than assumed.
      #
      # Three files come back with no verdict at all, and it is worth knowing
      # which rather than reading the count as complete coverage:
      # sim/i2c_shm/src/i2c_shm_link.cpp, sim/spi_shm/src/spi_shm_link.cpp and
      # sim/i2c_shm/test/test_i2c_shm_mmc5983ma.cpp. Each constructs a
      # std::thread from a lambda, and IWYU's frontend fails to instantiate
      # libstdc++ 14's std::tuple<lambda> ("no matching function for call to
      # 'get'", inside <tuple> itself). Plain clang++ compiles all three -- the
      # Build step above does exactly that -- so this is an IWYU/libstdc++
      # mismatch rather than anything wrong with the sources, and it will go
      # away with a newer iwyu package rather than with a change here.
      - name: Run include-what-you-use
        continue-on-error: true
        run: |
          mappings=(-Xiwyu --mapping_file="$PWD/.iwyu.imp")
          for shipped in /usr/share/include-what-you-use/gcc.stl.headers.imp \
                         /usr/share/include-what-you-use/gcc.symbols.imp \
                         /usr/share/include-what-you-use/gcc.libc.imp; do
            if [ -f "$shipped" ]; then
              mappings+=(-Xiwyu --mapping_file="$shipped")
            fi
          done
          echo "IWYU mapping files in use: ${mappings[*]}"

          iwyu_tool -p build/iwyu modules apps sim \
            -- -Xiwyu --cxx17ns -Xiwyu --no_fwd_decls "${mappings[@]}" \
            | tee iwyu-report.txt

      # Deliberately its own step, without continue-on-error: that flag exists so
      # IWYU's *findings* never fail the job, and it would swallow this exit code
      # too. A report that inspected nothing is the failure mode this repo keeps
      # hitting -- three jobs so far have been green while checking nothing -- so
      # the per-file verdict count is asserted rather than assumed. modules/ and
      # sim/ alone are ~100 files; 50 is a floor that a real regression in
      # compile_commands.json trips long before a few files move.
      - name: Check the report is not empty
        run: |
          analysed=$(grep -cE 'has correct #includes/fwd-decls|should (add|remove) these lines' iwyu-report.txt || true)
          echo "IWYU reported on ${analysed} files"
          if [ "${analysed}" -lt 50 ]; then
            echo "::error::IWYU reported on only ${analysed} files -- expected the whole of modules/ and sim/."
            echo "::error::Something stopped compile_commands.json being populated, so the report is not trustworthy."
            exit 1
          fi

      - name: Upload IWYU report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iwyu-report
          path: iwyu-report.txt
