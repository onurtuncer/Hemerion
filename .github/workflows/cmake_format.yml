name: CMake-Format

on:
  push:
    branches:
      - main
  pull_request:
    # Match on the filenames .run-cmake-format actually formats rather than a list of
    # top-level directories -- a directory list silently stops covering new trees (that is
    # how doc/, examples/ and tests/ drifted out of format), and the script scans the whole repo.
    paths:
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.github/workflows/cmake_format.yml'
      - '**/.cmake-format'
      - '.run-cmake-format'
  schedule:
    - cron: '0 5 * * *'

jobs:
  cmake_format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run CMake Lang Format Check
        run: |
          set -euo pipefail
          # Pinned: cmakelang's layout decisions change between releases, so an unpinned
          # install turns any upstream release into a red main branch on files nobody touched.
          sudo pip3 install --break-system-packages 'cmakelang==0.6.13'
          bash .run-cmake-format
          output=$(git diff)
          if [ -n "$output" ]; then
            printf '\033[0;31mCMake format error: run the script "./.run-cmake-format" and commit the result\033[0m\n'
            # %s, not the diff as a format string -- a diff containing % would be mangled.
            printf '%s\n' "$output"
            exit 1
          fi
