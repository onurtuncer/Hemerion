name: Cross Build (ARM)

on:
  # pull_request is unfiltered, so PRs always cross-build. This push filter is what guards
  # commits that land on a branch directly, and it has to name everything the cross build
  # consumes -- the root CMakeLists.txt and the vendored FreeRTOS submodule were both
  # missing, so a direct push touching only those skipped the ARM build entirely.
  push:
    paths:
      - 'modules/**'
      - 'apps/**'
      - 'bsp/**'
      - 'toolchains/**'
      - 'cmake/**'
      - 'vendor/**'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - 'CMakePresets.json'
      - '.gitmodules'
      - '.github/workflows/cross_build.yml'
  pull_request:

jobs:
  renode-h743:
    name: renode-h743 (build only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install arm-none-eabi-gcc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libnewlib-dev libstdc++-arm-none-eabi-newlib

      - name: Configure
        run: cmake --preset=renode-h743

      - name: Build
        run: cmake --build --preset=renode-h743

  cross-stm32f446:
    name: cross-stm32f446 (build only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install arm-none-eabi-gcc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libnewlib-dev libstdc++-arm-none-eabi-newlib

      - name: Configure
        run: cmake --preset=cross-stm32f446

      - name: Build
        run: cmake --build --preset=cross-stm32f446
