version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    groups:
      official-actions:
        patterns:
          - "actions/*"
      third-party-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/doc"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docs"
    ignore:
      # breathe 5.0.0 cannot resolve a single doxygenfile directive under the
      # Doxygen/Sphinx pairing this repository uses -- every doc/api page goes
      # "Cannot find file" and build-docs fails. doc/requirements.txt said so
      # in a comment and was bumped regardless on 2026-09-30, so the guard
      # belongs here where the bot reads it. Drop this entry when a release
      # fixes it, and re-test build-docs on the PR before merging.
      - dependency-name: "breathe"
        update-types:
          - "version-update:semver-major"
